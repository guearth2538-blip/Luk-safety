<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Man QR Directory</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;margin:0;background:#f3f4f6;color:#111827}header{position:sticky;top:0;background:#991b1b;color:#fff;padding:14px 18px;z-index:5}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.85}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:14px;background:#fff;position:sticky;top:69px;z-index:4;border-bottom:1px solid #e5e7eb}.tools input{flex:1;min-width:220px;padding:11px;border:1px solid #d1d5db;border-radius:10px}.tools button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.print{background:#b91c1c;color:white}.grid{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0000000d;break-inside:avoid}.code{font-weight:800;color:#991b1b}.name{font-weight:700;margin:6px 0}.meta{font-size:13px;color:#6b7280;margin-bottom:8px}.qr{display:flex;justify-content:center;padding:8px}.open{display:block;text-align:center;text-decoration:none;background:#f3f4f6;color:#111827;padding:9px;border-radius:9px;font-weight:700}.empty{text-align:center;padding:40px;color:#6b7280}@media print{header,.tools,.open{display:none!important}body{background:#fff}.grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:0}.card{box-shadow:none;border:1px solid #ddd;border-radius:8px;padding:9px;page-break-inside:avoid}.qr canvas,.qr img{width:110px!important;height:110px!important}.name{font-size:13px}.meta{font-size:11px}}</style></head><body><header><h1>🔥 Fire Man QR Code</h1><p>QR สำหรับจุดตรวจทั้งหมดจาก Master Data</p></header><div class="tools"><input id="q" placeholder="ค้นหา LOC / จุดติดตั้ง / ชั้น"><button class="print" onclick="window.print()">🖨️ พิมพ์ QR</button></div><main id="grid" class="grid"><div class="empty">กำลังโหลดจุดติดตั้ง...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="fireman-qr.js"></script></body></html>
