<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#991b1b"><title>Fire Man Inspection</title><link rel="stylesheet" href="fireman.css"></head>
<body>
<header><div><b>🔥 Fire Man Inspection</b><small>สแกน QR • ตรวจ • ถ่ายรูป • บันทึก</small></div><button id="logout" class="hidden">ออก</button></header>
<main>
<section id="scanState" class="card state"><div class="big">▣</div><h1>กรุณาสแกน QR ที่หน้าตู้</h1><p>หน้านี้ใช้สำหรับบันทึกการตรวจเท่านั้น</p></section>
<section id="loginState" class="card hidden"><h2>เข้าสู่ระบบ Fire Man</h2><p id="loginLoc"></p><form id="loginForm"><label>อีเมล<input id="email" type="email" required autocomplete="username"></label><label>รหัสผ่าน<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">เข้าสู่ระบบ</button><p id="loginMsg" class="err"></p></form></section>
<section id="app" class="hidden"><div class="card location"><span id="locCode" class="badge"></span><h1 id="locName"></h1><p><b>ชั้น:</b> <span id="floor"></span> <span id="building"></span></p><p id="when"></p></div><div class="card"><label>ชื่อผู้ตรวจหน้างาน<select id="inspector"><option value="">เลือกชื่อผู้ตรวจ</option></select></label></div><form id="form"><div id="equipment"></div><div class="card"><h2>📷 รูปภาพการตรวจ</h2><label class="photo"><input id="photos" type="file" accept="image/*" capture="environment" multiple><span>📸</span><b>ถ่ายรูป / เลือกรูป</b></label><div id="preview"></div></div><button id="save" class="primary save" type="submit">💾 บันทึกผลการตรวจ</button></form></section>
<section id="done" class="card state hidden"><div class="big">✅</div><h1>บันทึกเรียบร้อย</h1><p>สามารถปิดหน้านี้ แล้วเดินตรวจจุดถัดไปได้</p></section>
<div id="toast"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="fireman.js"></script></body></html>
